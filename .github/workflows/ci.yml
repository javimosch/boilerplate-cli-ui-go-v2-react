name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./boilerplate-cli-ui-go-v2-react version

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./boilerplate-cli-ui-go-v2-react version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
